<!doctype html>
<!-- 建议通过本地服务器或在线部署访问，以确保浏览器允许跨域 API 请求。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8dfe9">
<title>GeoDarts — 把下一站交给飞镖</title>
<link href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" rel="stylesheet"><script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script><script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
<style>
:root{font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#18231f;background:#f5f5ef;font-synthesis:none}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}#map{position:absolute;inset:0;background:#d9e9eb}.topbar{position:absolute;z-index:3;top:18px;left:18px;display:flex;align-items:center;gap:12px;padding:10px 15px 10px 11px;border:1px solid #15201d14;border-radius:16px;background:#fffffff0;box-shadow:0 8px 28px #1e302b21;backdrop-filter:blur(12px);pointer-events:none}.logo{display:grid;width:38px;height:38px;place-items:center;border-radius:12px;background:#d9f36a;font-size:21px}.brand{font-weight:850;letter-spacing:-.04em}.tagline{margin-top:2px;color:#718079;font-size:11px}.hero{position:absolute;z-index:2;top:50%;left:50%;display:flex;flex-direction:column;align-items:center;gap:14px;transform:translate(-50%,-50%);width:min(520px,calc(100% - 32px));text-align:center;pointer-events:none}.hero h1{margin:0;color:#17251f;font-size:clamp(29px,5vw,48px);letter-spacing:-.055em;text-shadow:0 2px 20px #fff9}.hero p{margin:0;color:#415149;font-size:15px;text-shadow:0 1px 12px #fff}.throw-button{pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:12px;min-width:220px;min-height:66px;padding:0 30px;border:0;border-radius:18px;background:#d9f36a;box-shadow:0 12px 34px #1b2a1e38;color:#19241c;font-size:20px;font-weight:800;font-family:inherit;cursor:pointer;transition:transform .18s,box-shadow .18s,background .18s}.throw-button:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 17px 38px #1b2a1e47}.throw-button:active{transform:scale(.98)}.throw-button:disabled{cursor:wait;opacity:.78}.throw-icon{font-size:28px}.status{position:absolute;z-index:5;top:105px;left:50%;max-width:calc(100% - 32px);width:max-content;padding:11px 16px;transform:translateX(-50%);border-radius:12px;background:#18241f;color:white;font-size:13px;text-align:center;box-shadow:0 8px 24px #1e302b2e}.status[hidden]{display:none}.status.error{background:#a7352a}.result-card{position:absolute;z-index:4;right:18px;bottom:44px;width:min(390px,calc(100% - 36px));max-height:min(72vh,680px);overflow:auto;padding:20px;border:1px solid #15201d12;border-radius:20px;background:#fffffff5;box-shadow:0 14px 44px #1e302b30;backdrop-filter:blur(14px);animation:card-in .28s ease-out}.result-card[hidden]{display:none}@keyframes card-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.card-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;color:#78847e;font-size:11px;font-weight:750;letter-spacing:.1em;text-transform:uppercase}.close-button{display:grid;width:30px;height:30px;padding:0;place-items:center;border:0;border-radius:50%;background:#eff1eb;color:#57635c;cursor:pointer;font-size:19px}.destination{margin:0 0 5px;font-size:26px;font-weight:850;letter-spacing:-.045em;line-height:1.15}.dart-marker{width:44px;height:54px;display:grid;place-items:center;font-size:40px;line-height:1;filter:drop-shadow(0 5px 4px #17221c66);user-select:none;pointer-events:none}.flight-dart{position:absolute;z-index:8;width:44px;height:54px;display:grid;place-items:center;font-size:40px;line-height:1;filter:drop-shadow(0 5px 4px #17221c66);pointer-events:none;user-select:none;will-change:left,top,transform,opacity}.flight-dart.fly{animation:dart-flight 1.15s cubic-bezier(.18,.75,.22,1) both}@keyframes dart-flight{0%{opacity:0;transform:translate(var(--fly-x),var(--fly-y)) rotate(-36deg) scale(.48)}70%{opacity:1;transform:translate(0,0) rotate(14deg) scale(1.12)}84%{transform:translate(0,0) rotate(-7deg) scale(.94)}100%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}}.attribution-footer{position:absolute;z-index:2;bottom:0;left:0;padding:7px 10px;border-top-right-radius:8px;background:#ffffffe0;color:#53625b;font-size:10px;pointer-events:none}.maplibregl-ctrl-attrib{font-size:10px!important}@media(max-width:600px){.topbar{top:12px;left:12px}.hero{top:45%}.hero h1{font-size:32px}.throw-button{min-height:60px}.result-card{right:10px;bottom:42px;width:calc(100% - 20px);max-height:55vh}.status{top:82px}}
#map canvas{filter:hue-rotate(280deg) saturate(1.4) brightness(1.05)}
:root{color:#603b50;background:#fff4f8}
.topbar{border-color:#f2d3e1;background:#fff8fbeF;box-shadow:0 8px 28px #8c476622}.logo{background:#ffc4d9}.brand,.hero h1,.destination{color:#743d5b}.tagline,.hero p,.card-heading,.detail-label{color:#986f85}.hero p{text-shadow:0 1px 12px #fff}.throw-button{background:#ffb8d0;color:#713852;box-shadow:0 12px 34px #a84f7440}.throw-button:hover{background:#ffa3c3;box-shadow:0 17px 38px #a84f7450}.status{background:#88415f;box-shadow:0 8px 24px #8c476633}.status.error{background:#a73555}.result-card{border-color:#f1d7e2;background:#fffafd;box-shadow:0 14px 44px #8c476633}.close-button{background:#fde8f0;color:#874c68}
.flight-dart::before{content:"";position:absolute;z-index:-1;width:52px;left:-38px;top:5px;border-top:2px dashed #ed78a2;opacity:.8;transform:rotate(48deg);transform-origin:right center;animation:trail-pulse .34s ease-in-out infinite alternate}
.flight-dart svg,.dart-marker svg{display:block;width:44px;height:54px;overflow:visible}.dart-marker.hit svg{animation:impact-bounce .48s cubic-bezier(.18,.85,.28,1.4)}
.impact-particle{position:absolute;z-index:9;pointer-events:none;font-size:17px;animation:particle-pop .78s ease-out forwards;will-change:transform,opacity}
@keyframes dart-flight{0%{opacity:0;transform:translate(var(--fly-x),var(--fly-y)) rotate(-145deg) scale(.55)}48%{opacity:1;transform:translate(var(--arc-x),var(--arc-y)) rotate(-12deg) scale(.92)}76%{transform:translate(-5px,4px) rotate(12deg) scale(1.12)}88%{transform:translate(2px,-2px) rotate(-8deg) scale(.94)}100%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}}
@keyframes trail-pulse{from{opacity:.38}to{opacity:.95}}@keyframes impact-bounce{0%{transform:scale(1)}32%{transform:scale(1.3) rotate(-14deg)}62%{transform:scale(.88) rotate(8deg)}82%{transform:scale(1.12) rotate(-4deg)}100%{transform:scale(1) rotate(0)}}@keyframes particle-pop{0%{opacity:0;transform:translate(0,0) scale(.3) rotate(0)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(35deg)}}.detail-label{margin:15px 0 5px;color:#986f85;font-size:11px;font-weight:750;letter-spacing:.06em;text-transform:uppercase}.result-address,.coordinates{margin:0;color:#69465a;font-size:13px;line-height:1.55;overflow-wrap:anywhere}.coordinates{font-variant-numeric:tabular-nums}.ai-analysis{padding:12px 13px;border:1px solid #f1d7e2;border-radius:13px;background:#fff4f8;color:#69465a;font-size:13px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.ai-label{margin-top:18px}</style>
</head>
<body>
<div id="map" aria-label="申根区地图"></div>
<header class="topbar"><div class="logo" aria-hidden="true">🎯</div><div><div class="brand">GeoDarts</div><div class="tagline">让飞镖决定下一站</div></div></header>
<main class="hero"><h1>下一站，交给运气。</h1><p>在申根区随机选一个落点，开始你的意外旅程。</p><button id="throw-button" class="throw-button" type="button"><span class="throw-icon" aria-hidden="true">🎯</span><span>扔飞镖</span></button></main>
<div id="status" class="status" role="status" aria-live="polite" hidden></div>
<section id="result-card" class="result-card" aria-live="polite" hidden><div class="card-heading"><span>飞镖命中的地方</span><button id="close-card" class="close-button" type="button" aria-label="关闭结果">×</button></div><h2 id="destination" class="destination">—</h2><div class="detail-label">完整地址</div><p id="address" class="result-address">正在获取地址…</p><div class="detail-label">经纬度</div><p id="coordinates" class="coordinates">—</p><div class="detail-label ai-label">AI 周边灵感</div><div id="ai-analysis" class="ai-analysis" aria-live="polite">等待飞镖落点…</div></section>
<div class="attribution-footer">© OpenStreetMap contributors</div>
<script>
(()=>{
 "use strict";
 const SCHENGEN=new Set(["AT","BE","BG","HR","CZ","DK","EE","FI","FR","DE","GR","HU","IS","IT","LV","LI","LT","LU","MT","NL","NO","PL","PT","RO","SK","SI","ES","SE","CH"]);
 const ISO3={AUT:"AT",BEL:"BE",BGR:"BG",HRV:"HR",CZE:"CZ",DNK:"DK",EST:"EE",FIN:"FI",FRA:"FR",DEU:"DE",GRC:"GR",HUN:"HU",ISL:"IS",ITA:"IT",LVA:"LV",LIE:"LI",LTU:"LT",LUX:"LU",MLT:"MT",NLD:"NL",NOR:"NO",POL:"PL",PRT:"PT",ROU:"RO",SVK:"SK",SVN:"SI",ESP:"ES",SWE:"SE",CHE:"CH"};
 const BORDER_URL="https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson";
 const map=new maplibregl.Map({container:"map",style:"https://tiles.openfreemap.org/styles/liberty",center:[15,53],zoom:3.25,minZoom:2,maxZoom:18,attributionControl:false});
 map.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-right");map.addControl(new maplibregl.AttributionControl({compact:true,customAttribution:"© OpenStreetMap contributors"}),"bottom-right");
 const button=document.getElementById("throw-button"),card=document.getElementById("result-card"),destination=document.getElementById("destination"),addressEl=document.getElementById("address"),coordinatesEl=document.getElementById("coordinates"),aiAnalysis=document.getElementById("ai-analysis"),status=document.getElementById("status");
 let polygons=[],marker=null,flightElement=null,flightPoint=null,moveHandler=null,statusTimer=null,round=0,bordersReady=false,busy=false,lastNominatim=0,nominatimController=null;
 const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
 function setStatus(message,error=false,duration=0){clearTimeout(statusTimer);status.textContent=message;status.className="status"+(error?" error":"");status.hidden=false;if(duration)statusTimer=setTimeout(()=>status.hidden=true,duration)}
 function clearStatus(){clearTimeout(statusTimer);status.hidden=true}
 function getCountryCode(p){for(const key of ["ISO3166-1-Alpha-3","ISO3166-1-Alpha-2","ISO_A3","ISO_A2","iso_a3","iso_a2","ADM0_A3","SOV_A3","ISO3166-1-alpha-3","ISO3166-1"]){const value=p[key];if(!value)continue;const code=String(value).toUpperCase();if(SCHENGEN.has(code))return code;if(ISO3[code])return ISO3[code]}return null}
 async function loadBorders(){const response=await fetch(BORDER_URL);if(!response.ok)throw Error(`边界数据 HTTP ${response.status}`);const data=await response.json();polygons=data.features.filter(f=>getCountryCode(f.properties||{})&&f.geometry).map(f=>turf.feature(f.geometry));if(!polygons.length)throw Error("没有加载到申根国家边界");bordersReady=true;clearStatus()}
 function insideSchengen(point){const feature=turf.point([point.lng,point.lat]);return polygons.some(poly=>turf.booleanPointInPolygon(feature,poly))}
 function randomPoint(){const b=turf.bbox(turf.featureCollection(polygons));return turf.point([b[0]+Math.random()*(b[2]-b[0]),b[1]+Math.random()*(b[3]-b[1])])}
 function validRandomPoint(){for(let i=0;i<20000;i++){const p=randomPoint();if(insideSchengen({lng:p.geometry.coordinates[0],lat:p.geometry.coordinates[1]}))return p}throw Error("暂时无法在申根区生成随机落点")}
 function clearMarker(){if(marker){marker.remove();marker=null}}
 function positionFlight(){if(!flightElement||!flightPoint)return;const projected=map.project(flightPoint);flightElement.style.left=`${projected.x-22}px`;flightElement.style.top=`${projected.y-27}px`}
 function spawnImpact(lngLat){const container=map.getContainer(),p=map.project(lngLat);for(let i=0;i<7;i++){const particle=document.createElement("span");particle.className="impact-particle";particle.textContent=i%2?"✦":"♥";particle.style.left=`${p.x-7}px`;particle.style.top=`${p.y-10}px`;particle.style.setProperty("--dx",`${Math.round((Math.random()-.5)*90)}px`);particle.style.setProperty("--dy",`${Math.round(-24-Math.random()*65)}px`);container.appendChild(particle);particle.addEventListener("animationend",()=>particle.remove(),{once:true})}} function throwMarker(lngLat){clearMarker();if(flightElement){flightElement.remove();flightElement=null}if(moveHandler){map.off("move",moveHandler);map.off("zoom",moveHandler);moveHandler=null}const container=map.getContainer();flightElement=document.createElement("div");flightElement.className="flight-dart fly";flightElement.innerHTML='<svg viewBox="0 0 44 54" aria-hidden="true"><path d="M7 5L22 27" stroke="#b93459" stroke-width="4.2" stroke-linecap="round"/><path d="M22 27L15.5 21.5L19.5 20Z" fill="#f04f77" stroke="#a52e52" stroke-width="1.2"/><path d="M5 4C1 0-3 6 5 12C13 6 9 0 5 4Z" transform="translate(4 0) rotate(-18 5 6)" fill="#ff8eae" stroke="#c23a62" stroke-width="1.2"/><path d="M14 2C10 -2 6 4 14 10C22 4 18 -2 14 2Z" transform="translate(0 1) rotate(20 14 5)" fill="#ffc0d3" stroke="#c23a62" stroke-width="1.2"/><circle cx="22" cy="27" r="2.3" fill="#ffcf72"/></svg>';flightElement.setAttribute("aria-label","飞镖飞行中");const rect=container.getBoundingClientRect(),sx=(Math.random()<.5?-1:1)*(rect.width*.62+90),sy=(Math.random()<.5?-1:1)*(rect.height*.56+90);flightElement.style.setProperty("--fly-x",`${sx}px`);flightElement.style.setProperty("--fly-y",`${sy}px`);flightElement.style.setProperty("--arc-x",`${sx*.52}px`);flightElement.style.setProperty("--arc-y",`${sy*.52-64}px`);flightPoint=maplibregl.LngLat.convert(lngLat);container.appendChild(flightElement);positionFlight();moveHandler=positionFlight;map.on("move",moveHandler);map.on("zoom",moveHandler);return new Promise(resolve=>{let done=false;const finish=()=>{if(done)return;done=true;if(flightElement){flightElement.classList.remove("fly");flightElement.classList.add("dart-marker","hit");flightElement.setAttribute("aria-label","飞镖命中点");flightElement.style.pointerEvents="none"}if(moveHandler){map.off("move",moveHandler);map.off("zoom",moveHandler);moveHandler=null}flightElement.style.removeProperty("left");flightElement.style.removeProperty("top");marker=new maplibregl.Marker({element:flightElement,anchor:"center"}).setLngLat(lngLat).addTo(map);spawnImpact(lngLat);flightElement=null;flightPoint=null;resolve()};flightElement.addEventListener("animationend",finish,{once:true});setTimeout(finish,1300)})} function niceName(tags){return tags["name:zh"]||tags.name||tags["name:en"]||"未命名地点"}
 async function requestNominatim(point,token){const elapsed=Date.now()-lastNominatim;if(elapsed<1100)await pause(1100-elapsed);if(token!==round)return null;lastNominatim=Date.now();nominatimController=new AbortController();const url=new URL("https://nominatim.openstreetmap.org/reverse");url.search=new URLSearchParams({format:"jsonv2",lat:String(point.lat),lon:String(point.lng),zoom:"10",addressdetails:"1"});console.log("Nominatim 请求",url.href);const response=await fetch(url,{headers:{Accept:"application/json"},signal:nominatimController.signal});if(!response.ok)throw Error(`地名查询 HTTP ${response.status}`);const data=await response.json();console.log("Nominatim 结果",url.href,data);return data}
 async function loadResult(point,token){destination.textContent="正在识别地点…";addressEl.textContent="正在获取地址…";coordinatesEl.textContent=`${point.lat.toFixed(6)}, ${point.lng.toFixed(6)}`;aiAnalysis.textContent="等待地点信息…";card.hidden=false;let place;try{place=await requestNominatim(point,token);if(token!==round)return;if(!place||!place.address)throw new Error("地名服务未返回有效地址信息")}catch(error){if(error.name==="AbortError"||token!==round)return;destination.textContent="无法识别地点";addressEl.textContent="暂时无法获取地址";aiAnalysis.textContent="暂时无法获取地点信息，无法分析周边推荐。";console.log("Nominatim 请求失败，未调用 AI",error);return}const a=place.address;destination.textContent=a.city||a.town||a.village||a.municipality||a.county||a.state||a.region||place.name||place.display_name?.split(",")[0]||"未知地点";addressEl.textContent=place.display_name||Object.values(a).filter(Boolean).join(", ")||"未能获取完整地址";const prompt=`请用简短中文介绍一下${destination.textContent}（${addressEl.textContent}）附近有什么好玩的地方，推荐几个类型的景点，字数控制在150字以内。飞镖落点坐标：${point.lat.toFixed(5)}, ${point.lng.toFixed(5)}。你没有实时地图或营业状态数据；不确定的具体地点请提醒用户核实，不要编造精确地址或开放时间。`;aiAnalysis.textContent="AI 正在为你分析周边好玩的地方...";try{const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),35000);let response,data;try{response=await fetch("/api/deepseek",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({prompt}),signal:controller.signal});data=await response.json().catch(()=>({}))}finally{clearTimeout(timeout)}if(token!==round)return;if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);if(typeof data.analysis!=="string"||!data.analysis.trim())throw new Error("AI 服务返回内容为空");aiAnalysis.textContent=data.analysis.trim()}catch(error){if(token!==round)return;aiAnalysis.textContent=error.name==="AbortError"?"AI 分析超时，请稍后再试。":"AI 暂时无法生成推荐，请稍后重试。";console.log("/api/deepseek 请求失败",error)}} async function throwDart(){if(busy)return;busy=true;button.disabled=true;button.querySelector("span:last-child").textContent="飞镖出发中…";card.hidden=true;clearStatus();if(nominatimController)nominatimController.abort();const token=++round;try{if(!bordersReady){setStatus("正在加载申根区地图边界…");await waitForBorders();if(!bordersReady)throw Error("申根区边界无法加载，请检查网络后刷新页面")};const point=validRandomPoint(),lngLat={lng:point.geometry.coordinates[0],lat:point.geometry.coordinates[1]};map.flyTo({center:[lngLat.lng,lngLat.lat],zoom:Math.max(map.getZoom(),6.2),duration:1150,essential:true});await throwMarker(lngLat);if(token!==round)return;clearStatus();setStatus("命中！正在获取地名和地址…");await loadResult(lngLat,token);if(token===round)clearStatus()}catch(error){if(token===round){setStatus(error.message||"这次没有成功，请再试一次。",true,5000);console.error(error)}}finally{if(token===round){busy=false;button.disabled=false;button.querySelector("span:last-child").textContent="再扔一次"}}}
 let bordersPromise=null;function waitForBorders(){if(!bordersPromise)bordersPromise=loadBorders().catch(error=>{console.error(error);bordersReady=false;bordersPromise=null;clearStatus();return false});return bordersPromise}
 button.addEventListener("click",throwDart);document.getElementById("close-card").addEventListener("click",()=>card.hidden=true);
 waitForBorders().catch(()=>{});
})();
</script>
</body>
</html>
