<!doctype html>
<!-- 建议通过本地服务器或在线部署访问，以确保浏览器允许跨域 API 请求。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8dfe9">
<title>椰椰和小鱼的旅行飞镖</title>
<link href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" rel="stylesheet"><script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script><script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
<style>
:root{font-family:"ZCOOL KuaiLe","Microsoft YaHei","PingFang SC",sans-serif;color:#684957;background:#fff7f4;font-synthesis:none}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}#map{position:absolute;inset:0;background:#a2d2ff}.topbar{position:absolute;z-index:3;top:18px;left:18px;display:flex;align-items:center;gap:12px;max-width:calc(100% - 36px);padding:11px 17px 11px 12px;border:1px solid #ffe0e9;border-radius:22px;background:#fffaf5ed;box-shadow:0 8px 28px #ad708034;backdrop-filter:blur(12px);pointer-events:none}.logo{display:grid;flex:none;width:42px;height:42px;place-items:center;border-radius:16px;background:#ffe1e8;font-size:23px}.brand{color:#9b536e;font-size:clamp(18px,2.5vw,25px);font-weight:800;letter-spacing:.02em;text-shadow:0 2px 0 #fff,0 3px 10px #f6bdcf}.tagline{margin-top:3px;color:#a97888;font-size:12px}.throw-button{position:absolute;z-index:5;left:50%;bottom:calc(40px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:12px;min-width:248px;min-height:76px;padding:0 34px;border:1px solid #ffeff4;border-radius:28px;background:linear-gradient(145deg,#ffc8d8 0%,#f69dbb 52%,#ea83a7 100%);box-shadow:0 9px 0 #cf7192,0 14px 25px #a74c7440,inset 0 3px 5px #fff9;color:#713d54;font-size:23px;font-weight:800;font-family:inherit;cursor:pointer;transition:transform .18s,box-shadow .18s,filter .18s}.throw-button:hover{transform:translate(-50%,-3px);filter:saturate(1.05);box-shadow:0 12px 0 #cf7192,0 18px 28px #a74c7440,inset 0 3px 5px #fff9}.throw-button:active{transform:translate(-50%,3px);box-shadow:0 5px 0 #cf7192,0 9px 18px #a74c7438,inset 0 2px 4px #fff9}.throw-button:disabled{cursor:wait;opacity:.8}.throw-icon{font-size:30px}.status{position:absolute;z-index:6;top:88px;left:50%;max-width:calc(100% - 32px);width:max-content;padding:12px 18px;transform:translateX(-50%);border:1px solid #ffe0e9;border-radius:18px;background:#fffaf5ed;color:#80566a;font-size:14px;text-align:center;box-shadow:0 8px 24px #8c476622;backdrop-filter:blur(10px)}.status[hidden]{display:none}.status.error{background:#fff0f0;color:#a73555}.result-card{position:absolute;z-index:4;right:18px;bottom:calc(132px + env(safe-area-inset-bottom));width:min(390px,calc(100% - 36px));max-height:min(65vh,620px);overflow:auto;padding:21px;border:1px solid #ffe0e9;border-radius:24px;background:#fffaf5f5;box-shadow:0 14px 44px #8c476633;backdrop-filter:blur(14px);animation:card-in .28s ease-out}.result-card[hidden]{display:none}@keyframes card-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.card-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;color:#a97888;font-size:12px;font-weight:750;letter-spacing:.05em}.close-button{display:grid;width:34px;height:34px;padding:0;place-items:center;border:0;border-radius:50%;background:#ffeaf0;color:#874c68;cursor:pointer;font-size:21px}.destination{margin:0 0 5px;color:#9b536e;font-size:28px;font-weight:850;letter-spacing:-.025em;line-height:1.2;text-shadow:0 1px 0 #fff}.detail-label{margin:15px 0 5px;color:#a97888;font-size:11px;font-weight:750;letter-spacing:.06em}.result-address,.coordinates{margin:0;color:#69465a;font-size:13px;line-height:1.55;overflow-wrap:anywhere}.coordinates{font-variant-numeric:tabular-nums}.ai-analysis{padding:13px 14px;border:1px solid #f1d7e2;border-radius:16px;background:#fff3f7;color:#69465a;font-size:13px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.attribution-footer{position:absolute;z-index:2;bottom:0;left:0;padding:7px 10px calc(7px + env(safe-area-inset-bottom));border-top-right-radius:12px;background:#fffaf5e8;color:#53625b;font-size:10px;pointer-events:none}.maplibregl-ctrl-attrib{font-size:10px!important}.dart-marker{width:44px;height:54px;display:grid;place-items:center;line-height:1;filter:drop-shadow(0 5px 4px #63384f66);user-select:none;pointer-events:none}.flight-dart{position:absolute;z-index:8;left:50%;top:50%;width:44px;height:54px;display:grid;place-items:center;line-height:1;filter:drop-shadow(0 5px 4px #63384f66);pointer-events:none;user-select:none;will-change:left,top,transform,opacity}.flight-dart svg,.dart-marker svg{display:block;width:44px;height:54px;overflow:visible}.flight-dart::before{content:"";position:absolute;z-index:-1;width:58px;left:-42px;top:5px;border-top:2px dashed #ed78a2;opacity:.85;transform:rotate(48deg);transform-origin:right center;animation:trail-pulse .34s ease-in-out infinite alternate}.flight-dart.fly{animation:dart-flight 1.15s cubic-bezier(.2,.72,.18,1) both}.dart-marker.hit svg{animation:impact-bounce .48s cubic-bezier(.18,.85,.28,1.4)}.impact-particle{position:absolute;z-index:9;pointer-events:none;font-size:17px;animation:particle-pop .78s ease-out forwards;will-change:transform,opacity}@keyframes dart-flight{0%{opacity:0;transform:translate(-50%,-50%) rotate(-145deg) scale(.55)}22%{opacity:1}50%{transform:translate(calc(var(--arc-x) - 50%),calc(var(--arc-y) - 50%)) rotate(-24deg) scale(.93)}78%{transform:translate(calc(var(--target-x) - 50%),calc(var(--target-y) - 50%)) rotate(10deg) scale(1.1)}88%{transform:translate(calc(var(--target-x) - 50%),calc(var(--target-y) - 50%)) rotate(-7deg) scale(.94)}100%{opacity:1;transform:translate(calc(var(--target-x) - 50%),calc(var(--target-y) - 50%)) rotate(0) scale(1)}}@keyframes trail-pulse{from{opacity:.35}to{opacity:.95}}@keyframes impact-bounce{0%{transform:scale(1)}32%{transform:scale(1.3) rotate(-14deg)}62%{transform:scale(.88) rotate(8deg)}82%{transform:scale(1.12) rotate(-4deg)}100%{transform:scale(1) rotate(0)}}@keyframes particle-pop{0%{opacity:0;transform:translate(0,0) scale(.3) rotate(0)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(35deg)}}@media(max-width:600px){.topbar{top:12px;left:12px;max-width:calc(100% - 24px);padding:9px 13px 9px 10px}.brand{font-size:clamp(16px,4.3vw,21px)}.tagline{font-size:11px}.throw-button{min-width:220px;min-height:68px;font-size:21px}.result-card{right:10px;bottom:calc(120px + env(safe-area-inset-bottom));width:calc(100% - 20px);max-height:48vh}.status{top:78px}}
</style>
</head>
<body>
<div id="map" aria-label="申根区地图"></div>
<header class="topbar"><div class="logo" aria-hidden="true">🥥</div><div><div class="brand">椰椰和小鱼的旅行飞镖</div><div class="tagline">把下一站交给一点点运气</div></div></header>
<button id="throw-button" class="throw-button" type="button"><span class="throw-icon" aria-hidden="true">🎯</span><span>扔飞镖</span></button>
<div id="status" class="status" role="status" aria-live="polite" hidden></div>
<section id="result-card" class="result-card" aria-live="polite" hidden><div class="card-heading"><span>飞镖命中的地方</span><button id="close-card" class="close-button" type="button" aria-label="关闭结果">×</button></div><h2 id="destination" class="destination">—</h2><div class="detail-label">完整地址</div><p id="address" class="result-address">正在获取地址…</p><div class="detail-label">经纬度</div><p id="coordinates" class="coordinates">—</p><div class="detail-label ai-label">AI 周边灵感</div><div id="ai-analysis" class="ai-analysis" aria-live="polite">等待飞镖落点…</div></section>
<div class="attribution-footer">© OpenStreetMap contributors</div>
<script>
(()=>{
 "use strict";
 const SCHENGEN=new Set(["AT","BE","BG","HR","CZ","DK","EE","FI","FR","DE","GR","HU","IS","IT","LV","LI","LT","LU","MT","NL","NO","PL","PT","RO","SK","SI","ES","SE","CH"]);
 const ISO3={AUT:"AT",BEL:"BE",BGR:"BG",HRV:"HR",CZE:"CZ",DNK:"DK",EST:"EE",FIN:"FI",FRA:"FR",DEU:"DE",GRC:"GR",HUN:"HU",ISL:"IS",ITA:"IT",LVA:"LV",LIE:"LI",LTU:"LT",LUX:"LU",MLT:"MT",NLD:"NL",NOR:"NO",POL:"PL",PRT:"PT",ROU:"RO",SVK:"SK",SVN:"SI",ESP:"ES",SWE:"SE",CHE:"CH"};
 const BORDER_URL="https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson";
 const map=new maplibregl.Map({container:"map",style:"https://tiles.openfreemap.org/styles/liberty",center:[15,53],zoom:3.25,minZoom:2,maxZoom:18,attributionControl:false});\n map.on("style.load",()=>{const style=map.getStyle();for(const layer of style.layers||[]){if(layer.type!=="background"&&layer.type!=="fill")continue;const id=layer.id.toLowerCase(),sourceLayer=String(layer["source-layer"]||"").toLowerCase();const water=/water|ocean|lake|river|sea/.test(id)||/water/.test(sourceLayer);if(!water)continue;const property=layer.type==="background"?"background-color":"fill-color";try{map.setPaintProperty(layer.id,property,"#A2D2FF")}catch(error){console.log("无法设置水体图层颜色",layer.id,error)}}});
 map.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-right");map.addControl(new maplibregl.AttributionControl({compact:true,customAttribution:"© OpenStreetMap contributors"}),"bottom-right");
 const button=document.getElementById("throw-button"),card=document.getElementById("result-card"),destination=document.getElementById("destination"),addressEl=document.getElementById("address"),coordinatesEl=document.getElementById("coordinates"),aiAnalysis=document.getElementById("ai-analysis"),status=document.getElementById("status");
 let polygons=[],marker=null,flightElement=null,flightPoint=null,moveHandler=null,statusTimer=null,round=0,bordersReady=false,busy=false,lastNominatim=0,nominatimController=null;
 const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
 function setStatus(message,error=false,duration=0){clearTimeout(statusTimer);status.textContent=message;status.className="status"+(error?" error":"");status.hidden=false;if(duration)statusTimer=setTimeout(()=>status.hidden=true,duration)}
 function clearStatus(){clearTimeout(statusTimer);status.hidden=true}
 function getCountryCode(p){for(const key of ["ISO3166-1-Alpha-3","ISO3166-1-Alpha-2","ISO_A3","ISO_A2","iso_a3","iso_a2","ADM0_A3","SOV_A3","ISO3166-1-alpha-3","ISO3166-1"]){const value=p[key];if(!value)continue;const code=String(value).toUpperCase();if(SCHENGEN.has(code))return code;if(ISO3[code])return ISO3[code]}return null}
 async function loadBorders(){const response=await fetch(BORDER_URL);if(!response.ok)throw Error(`边界数据 HTTP ${response.status}`);const data=await response.json();polygons=data.features.filter(f=>getCountryCode(f.properties||{})&&f.geometry).map(f=>turf.feature(f.geometry));if(!polygons.length)throw Error("没有加载到申根国家边界");bordersReady=true;clearStatus()}
 function insideSchengen(point){const feature=turf.point([point.lng,point.lat]);return polygons.some(poly=>turf.booleanPointInPolygon(feature,poly))}
 function randomPoint(){const b=turf.bbox(turf.featureCollection(polygons));return turf.point([b[0]+Math.random()*(b[2]-b[0]),b[1]+Math.random()*(b[3]-b[1])])}
 function validRandomPoint(){for(let i=0;i<20000;i++){const p=randomPoint();if(insideSchengen({lng:p.geometry.coordinates[0],lat:p.geometry.coordinates[1]}))return p}throw Error("暂时无法在申根区生成随机落点")}
 function clearMarker(){if(marker){marker.remove();marker=null}}
 function positionFlight(){if(!flightElement||!flightPoint)return;const p=map.project(flightPoint);flightElement.style.setProperty("--target-x",`${p.x}px`);flightElement.style.setProperty("--target-y",`${p.y}px`);flightElement.style.left="50%";flightElement.style.top="50%"}
 function spawnImpact(lngLat){const container=map.getContainer(),p=map.project(lngLat);for(let i=0;i<7;i++){const particle=document.createElement("span");particle.className="impact-particle";particle.textContent=i%2?"✦":"♥";particle.style.left=`${p.x-7}px`;particle.style.top=`${p.y-10}px`;particle.style.setProperty("--dx",`${Math.round((Math.random()-.5)*90)}px`);particle.style.setProperty("--dy",`${Math.round(-24-Math.random()*65)}px`);container.appendChild(particle);particle.addEventListener("animationend",()=>particle.remove(),{once:true})}}
 function throwMarker(lngLat){clearMarker();if(flightElement){flightElement.remove();flightElement=null}if(moveHandler){map.off("move",moveHandler);map.off("zoom",moveHandler);moveHandler=null}const container=map.getContainer();flightElement=document.createElement("div");flightElement.className="flight-dart fly";flightElement.innerHTML='<svg viewBox="0 0 44 54" aria-hidden="true"><path d="M7 5L22 27" stroke="#b93459" stroke-width="4.2" stroke-linecap="round"/><path d="M22 27L15.5 21.5L19.5 20Z" fill="#f04f77" stroke="#a52e52" stroke-width="1.2"/><path d="M5 4C1 0-3 6 5 12C13 6 9 0 5 4Z" transform="translate(4 0) rotate(-18 5 6)" fill="#ff8eae" stroke="#c23a62" stroke-width="1.2"/><path d="M14 2C10 -2 6 4 14 10C22 4 18 -2 14 2Z" transform="translate(0 1) rotate(20 14 5)" fill="#ffc0d3" stroke="#c23a62" stroke-width="1.2"/><circle cx="22" cy="27" r="2.3" fill="#ffcf72"/></svg>';flightElement.setAttribute("aria-label","飞镖飞行中");flightPoint=maplibregl.LngLat.convert(lngLat);const center=map.project(flightPoint),rect=container.getBoundingClientRect();flightElement.style.setProperty("--target-x",`${center.x}px`);flightElement.style.setProperty("--target-y",`${center.y}px`);flightElement.style.setProperty("--arc-x",`${center.x*.48+rect.width*.12}px`);flightElement.style.setProperty("--arc-y",`${center.y*.48-75}px`);container.appendChild(flightElement);moveHandler=positionFlight;positionFlight();map.on("move",moveHandler);map.on("zoom",moveHandler);return new Promise(resolve=>{let done=false;const finish=()=>{if(done)return;done=true;flightElement.classList.remove("fly");flightElement.classList.add("dart-marker","hit");flightElement.setAttribute("aria-label","飞镖命中点");flightElement.style.pointerEvents="none";resolve()};flightElement.addEventListener("animationend",finish,{once:true});setTimeout(finish,1300)})}
 function pinDart(lngLat){if(!flightElement)return;if(moveHandler){map.off("move",moveHandler);map.off("zoom",moveHandler);moveHandler=null}flightElement.style.removeProperty("left");flightElement.style.removeProperty("top");flightElement.style.removeProperty("--target-x");flightElement.style.removeProperty("--target-y");flightElement.style.removeProperty("--arc-x");flightElement.style.removeProperty("--arc-y");marker=new maplibregl.Marker({element:flightElement,anchor:"center"}).setLngLat(lngLat).addTo(map);spawnImpact(lngLat);flightElement=null;flightPoint=null} function niceName(tags){return tags["name:zh"]||tags.name||tags["name:en"]||"未命名地点"}
 async function requestNominatim(point,token){const elapsed=Date.now()-lastNominatim;if(elapsed<1100)await pause(1100-elapsed);if(token!==round)return null;lastNominatim=Date.now();nominatimController=new AbortController();const url=new URL("https://nominatim.openstreetmap.org/reverse");url.search=new URLSearchParams({format:"jsonv2",lat:String(point.lat),lon:String(point.lng),zoom:"10",addressdetails:"1"});console.log("Nominatim 请求",url.href);const response=await fetch(url,{headers:{Accept:"application/json"},signal:nominatimController.signal});if(!response.ok)throw Error(`地名查询 HTTP ${response.status}`);const data=await response.json();console.log("Nominatim 结果",url.href,data);return data}
 async function loadResult(point,token){destination.textContent="正在识别地点…";addressEl.textContent="正在获取地址…";coordinatesEl.textContent=`${point.lat.toFixed(6)}, ${point.lng.toFixed(6)}`;aiAnalysis.textContent="等待地点信息…";card.hidden=false;let place;try{place=await requestNominatim(point,token);if(token!==round)return;if(!place||!place.address)throw new Error("地名服务未返回有效地址信息")}catch(error){if(error.name==="AbortError"||token!==round)return;destination.textContent="无法识别地点";addressEl.textContent="暂时无法获取地址";aiAnalysis.textContent="暂时无法获取地点信息，无法分析周边推荐。";console.log("Nominatim 请求失败，未调用 AI",error);return}const a=place.address;destination.textContent=a.city||a.town||a.village||a.municipality||a.county||a.state||a.region||place.name||place.display_name?.split(",")[0]||"未知地点";addressEl.textContent=place.display_name||Object.values(a).filter(Boolean).join(", ")||"未能获取完整地址";const prompt=`请用简短中文介绍一下${destination.textContent}（${addressEl.textContent}）附近有什么好玩的地方，推荐几个类型的景点，字数控制在150字以内。飞镖落点坐标：${point.lat.toFixed(5)}, ${point.lng.toFixed(5)}。你没有实时地图或营业状态数据；不确定的具体地点请提醒用户核实，不要编造精确地址或开放时间。`;aiAnalysis.textContent="AI 正在为你分析周边好玩的地方...";try{const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),35000);let response,data;try{response=await fetch("/api/deepseek",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({prompt}),signal:controller.signal});data=await response.json().catch(()=>({}))}finally{clearTimeout(timeout)}if(token!==round)return;if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);if(typeof data.analysis!=="string"||!data.analysis.trim())throw new Error("AI 服务返回内容为空");aiAnalysis.textContent=data.analysis.trim()}catch(error){if(token!==round)return;aiAnalysis.textContent=error.name==="AbortError"?"AI 分析超时，请稍后再试。":"AI 暂时无法生成推荐，请稍后重试。";console.log("/api/deepseek 请求失败",error)}} async function throwDart(){if(busy)return;busy=true;button.disabled=true;button.querySelector("span:last-child").textContent="飞镖出发中…";card.hidden=true;clearStatus();if(nominatimController)nominatimController.abort();const token=++round;try{if(!bordersReady){setStatus("正在加载申根区地图边界…");await waitForBorders();if(!bordersReady)throw Error("申根区边界无法加载，请检查网络后刷新页面")};const point=validRandomPoint(),lngLat={lng:point.geometry.coordinates[0],lat:point.geometry.coordinates[1]};await throwMarker(lngLat);if(token!==round)return;map.flyTo({center:[lngLat.lng,lngLat.lat],zoom:12,duration:1500,essential:true});await new Promise(resolve=>map.once("moveend",resolve));if(token!==round)return;pinDart(lngLat);clearStatus();setStatus("命中！正在获取地名和地址…");await loadResult(lngLat,token);if(token===round)clearStatus()}catch(error){if(token===round){setStatus(error.message||"这次没有成功，请再试一次。",true,5000);console.error(error)}}finally{if(token===round){busy=false;button.disabled=false;button.querySelector("span:last-child").textContent="再扔一次"}}}
 let bordersPromise=null;function waitForBorders(){if(!bordersPromise)bordersPromise=loadBorders().catch(error=>{console.error(error);bordersReady=false;bordersPromise=null;clearStatus();return false});return bordersPromise}
 button.addEventListener("click",throwDart);document.getElementById("close-card").addEventListener("click",()=>card.hidden=true);
 waitForBorders().catch(()=>{});
})();
</script>
</body>
</html>
