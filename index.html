<link href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" rel="stylesheet"><script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script><script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
<style>
:root{font-family:"ZCOOL KuaiLe","Microsoft YaHei","PingFang SC",sans-serif;color:#684957;background:#fff7f4;font-synthesis:none}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}#map{position:absolute;inset:0;background:#a2d2ff}.topbar{position:absolute;z-index:3;top:18px;left:18px;display:flex;align-items:center;gap:12px;max-width:calc(100% - 36px);padding:11px 17px 11px 12px;border:1px solid #ffe0e9;border-radius:22px;background:#fffaf5ed;box-shadow:0 8px 28px #ad708034;backdrop-filter:blur(12px);pointer-events:none}.logo{display:grid;flex:none;width:42px;height:42px;place-items:center;border-radius:16px;background:#ffe1e8;font-size:23px}.brand{color:#9b536e;font-size:clamp(18px,2.5vw,25px);font-weight:800;letter-spacing:.02em;text-shadow:0 2px 0 #fff,0 3px 10px #f6bdcf}.tagline{margin-top:3px;color:#a97888;font-size:12px}.throw-button{position:absolute;z-index:5;left:50%;bottom:calc(40px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:12px;min-width:248px;min-height:76px;padding:0 34px;border:1px solid #ffeff4;border-radius:28px;background:linear-gradient(145deg,#ffc8d8 0%,#f69dbb 52%,#ea83a7 100%);box-shadow:0 9px 0 #cf7192,0 14px 25px #a74c7440,inset 0 3px 5px #fff9;color:#713d54;font-size:23px;font-weight:800;font-family:inherit;cursor:pointer;transition:transform .18s,box-shadow .18s,filter .18s}.throw-button:hover{transform:translate(-50%,-3px);filter:saturate(1.05);box-shadow:0 12px 0 #cf7192,0 18px 28px #a74c7440,inset 0 3px 5px #fff9}.throw-button:active{transform:translate(-50%,3px);box-shadow:0 5px 0 #cf7192,0 9px 18px #a74c7438,inset 0 2px 4px #fff9}.throw-button:disabled{cursor:wait;opacity:.8}.throw-icon{font-size:30px}.status{position:absolute;z-index:6;top:88px;left:50%;max-width:calc(100% - 32px);width:max-content;padding:12px 18px;transform:translateX(-50%);border:1px solid #ffe0e9;border-radius:18px;background:#fffaf5ed;color:#80566a;font-size:14px;text-align:center;box-shadow:0 8px 24px #8c476622;backdrop-filter:blur(10px)}.status[hidden]{display:none}.status.error{background:#fff0f0;color:#a73555}.result-card{position:absolute;z-index:4;right:18px;bottom:calc(132px + env(safe-area-inset-bottom));width:min(390px,calc(100% - 36px));max-height:min(65vh,620px);overflow:auto;padding:21px;border:1px solid #ffe0e9;border-radius:24px;background:#fffaf5f5;box-shadow:0 14px 44px #8c476633;backdrop-filter:blur(14px);animation:card-in .28s ease-out}.result-card[hidden]{display:none}@keyframes card-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.card-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;color:#a97888;font-size:12px;font-weight:750;letter-spacing:.05em}.close-button{display:grid;width:34px;height:34px;padding:0;place-items:center;border:0;border-radius:50%;background:#ffeaf0;color:#874c68;cursor:pointer;font-size:21px}.destination{margin:0 0 5px;color:#9b536e;font-size:28px;font-weight:850;letter-spacing:-.025em;line-height:1.2;text-shadow:0 1px 0 #fff}.detail-label{margin:15px 0 5px;color:#a97888;font-size:11px;font-weight:750;letter-spacing:.06em}.result-address,.coordinates{margin:0;color:#69465a;font-size:13px;line-height:1.55;overflow-wrap:anywhere}.coordinates{font-variant-numeric:tabular-nums}.ai-analysis{padding:13px 14px;border:1px solid #f1d7e2;border-radius:16px;background:#fff3f7;color:#69465a;font-size:13px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.attribution-footer{position:absolute;z-index:2;bottom:0;left:0;padding:7px 10px calc(7px + env(safe-area-inset-bottom));border-top-right-radius:12px;background:#fffaf5e8;color:#53625b;font-size:10px;pointer-events:none}.maplibregl-ctrl-attrib{font-size:10px!important}.fps-stage{position:absolute;inset:0;z-index:8;perspective:800px;perspective-origin:50% 50%;transform-style:preserve-3d;pointer-events:none;overflow:hidden}
.topbar{z-index:100}
.throw-button{z-index:101}
.status{z-index:102}
.result-card{z-index:110}
.fps-stage{z-index:10}
.country-overlay{position:fixed;inset:0;z-index:1;overflow:hidden;pointer-events:none;transform:none!important;contain:layout paint}
.country-overlay[hidden]{display:none}
.country-emoji{position:absolute;display:grid;width:36px!important;height:36px!important;min-width:36px;max-width:36px;min-height:36px;max-height:36px;place-items:center;left:0;top:0;transform:translate(-50%,-50%);font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:32px!important;line-height:1;white-space:nowrap;text-shadow:0 0 4px #fff,0 0 4px #fff,0 0 2px #fff;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4)) drop-shadow(0 2px 4px rgba(0,0,0,.2));will-change:transform;pointer-events:none;user-select:none}
.preference-bar{position:absolute;z-index:101;left:50%;bottom:calc(132px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;justify-content:center;gap:8px;width:max-content;max-width:calc(100% - 20px)}
.preference-button{flex:none;padding:9px 12px;border:1px solid #ffdce8;border-radius:999px;background:#fffaf5ed;box-shadow:0 5px 14px #9d59752b;color:#9b536e;font:700 13px "ZCOOL KuaiLe","Microsoft YaHei",sans-serif;white-space:nowrap;cursor:pointer;transition:transform .18s,background .18s,box-shadow .18s}

.preference-button[aria-pressed="true"]{border-color:#f18baa;background:#ffcadb;box-shadow:0 4px 0 #d989a4,0 7px 16px #9d597533;color:#713d54}

.trip-report[hidden],.ai-analysis[hidden],.hidden-play[hidden]{display:none}
.trip-report{display:grid;gap:11px;margin-top:12px}
.report-pill{display:inline-block;width:fit-content;padding:6px 11px;border-radius:999px;background:#ffe2eb;color:#8d4967;font-size:12px;font-weight:750}
.report-line{margin:0;color:#69465a;font-size:13px;line-height:1.6;overflow-wrap:anywhere}
.report-line strong{color:#9b536e}
.report-block{padding:12px 13px;border:1px solid #f1d7e2;border-radius:16px;background:#fff3f7}
.bill-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin-top:8px}
.bill-item{font-size:12px;color:#69465a;line-height:1.5}
.bill-total{grid-column:1/-1;margin-top:3px;padding-top:7px;border-top:1px dashed #e8bfd0;font-weight:800;color:#9b536e}
.bill-note{margin:8px 0 0;color:#a97888;font-size:11px;line-height:1.5}
.hidden-play{white-space:pre-line}
.postcard{position:relative;height:168px;margin:12px 0 4px;overflow:hidden;border-radius:16px;background:linear-gradient(145deg,#ffe4ed 0%,#fff8ec 48%,#c8e7fa 100%);box-shadow:0 7px 18px #9d597530}
.postcard::before{content:"";position:absolute;right:-20px;bottom:-56px;width:210px;height:115px;border-radius:50%;background:#a2d2ff80;transform:rotate(-13deg)}
.postcard::after{content:"";position:absolute;right:28px;top:20px;width:43px;height:43px;border-radius:50%;background:#fffdd0;box-shadow:0 0 24px #fffdd0}
.postcard-placeholder{position:absolute;z-index:1;inset:0;display:grid;place-items:center;padding:18px;color:#9b536e;font-size:15px;font-weight:750;text-align:center;text-shadow:0 1px 0 #fff}
.postcard-image{position:relative;z-index:2;display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .55s ease;box-shadow:inset 0 0 20px #7d4a6022}
.postcard-image.is-loaded{opacity:1}
.travel-score{font-size:22px;font-weight:850;color:#b24f76}
.rethink-button{width:100%;min-height:42px;margin-top:3px;border:0;border-radius:16px;background:linear-gradient(135deg,#ffd3e1,#f4a7c4);box-shadow:0 5px 0 #d782a3;color:#713d54;font:800 14px "ZCOOL KuaiLe","Microsoft YaHei",sans-serif;cursor:pointer}
.rethink-button:disabled{opacity:.65;cursor:wait}
.passport-button{position:absolute;z-index:120;top:74px;right:18px;padding:11px 15px;border:1px solid #ffdce8;border-radius:18px;background:#fffaf5f2;box-shadow:0 6px 20px #9d597530;color:#8d4967;font:750 13px "ZCOOL KuaiLe","Microsoft YaHei",sans-serif;cursor:pointer}
.passport-modal[hidden]{display:none}.passport-modal{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:20px;background:#67495a77;backdrop-filter:blur(7px)}
.passport-panel{width:min(700px,100%);max-height:min(82vh,720px);overflow:auto;padding:23px;border:1px solid #ffe0e9;border-radius:26px;background:#fffaf5;box-shadow:0 22px 70px #55374855}
.passport-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.passport-heading h2{margin:0;color:#9b536e;font-size:23px}.passport-close{width:34px;height:34px;border:0;border-radius:50%;background:#ffe4ed;color:#8d4967;font-size:22px;cursor:pointer}
.passport-summary{margin:7px 0 18px;color:#a97888;font-size:13px}.stamp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px}.stamp{position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;width:105px;height:105px;margin:auto;border:3px double #ee95b6;border-radius:50%;background:#fff0f5;color:#8b4864;text-align:center;box-shadow:0 5px 12px #a75d7b22;transform:rotate(-5deg)}.stamp:nth-child(even){transform:rotate(5deg)}.stamp.locked{border:2px dashed #cbbbc3;background:#f7f3f4;color:#9e969b;box-shadow:none}.stamp-emoji{font-size:28px;line-height:1}.stamp-name{margin-top:2px;font-size:11px;font-weight:800;line-height:1.15}.stamp-en{font-size:9px;line-height:1.1}.stamp-count{position:absolute;right:-4px;top:0;padding:2px 6px;border-radius:999px;background:#f59dbb;color:#fff;font-size:11px;font-weight:800}.passport-clear{display:block;margin:22px auto 0;padding:5px 9px;border:0;background:none;color:#a97888;font-size:11px;text-decoration:underline;cursor:pointer}
.itinerary-button{width:100%;min-height:45px;margin-top:11px;border:0;border-radius:16px;background:linear-gradient(135deg,#c9e8fb,#ffcade);box-shadow:0 5px 0 #b9a8c0;color:#713d54;font:800 14px "ZCOOL KuaiLe","Microsoft YaHei",sans-serif;cursor:pointer}.itinerary-button:disabled{opacity:.67;cursor:wait}.itinerary-panel[hidden]{display:none}.itinerary-panel{margin-top:15px;padding:15px;border:1px solid #e9d6e5;border-radius:17px;background:#fff3f8;color:#69465a;box-shadow:0 5px 18px #9d59751d;opacity:0;transform:translateY(8px);transition:opacity .3s ease,transform .3s ease}.itinerary-panel.visible{opacity:1;transform:translateY(0)}.itinerary-panel h3{margin:0 0 9px;color:#9b536e;font-size:16px}.itinerary-content{margin:0;white-space:pre-line;line-height:1.75;font-size:13px}
.destination-row{display:flex;align-items:center;flex-wrap:wrap;gap:7px 10px}.destination-row .destination{margin-bottom:0}.weather-badge{display:inline-flex;align-items:center;gap:4px;padding:5px 9px;border:1px solid #d7e9f6;border-radius:999px;background:#eef8ff;color:#6a6b81;font-size:12px;font-weight:800;white-space:nowrap;box-shadow:0 3px 9px #9abacf33}.weather-badge[hidden]{display:none}
.flight-info{margin-top:12px;padding:12px;border:1px solid #dbeaf5;border-radius:15px;background:#f5fbff}.flight-info-title{margin:0 0 5px;color:#8d4967;font-size:13px;font-weight:800}.flight-info-subtitle{margin:0 0 7px;color:#745d72;font-size:12px;font-weight:750}.flight-status{margin:0;color:#69465a;font-size:12px;line-height:1.6}.flight-booking{display:inline-block;margin-top:8px;padding:6px 12px;border-radius:999px;background:#ffcadb;color:#713d54;font-size:12px;font-weight:800;text-decoration:none;box-shadow:0 3px 8px #9d59752b}.flight-booking[hidden]{display:none}.flight-note{display:block;margin-top:6px;color:#a97888;font-size:10px}
#weather-layer{position:fixed;inset:0;width:100%;height:100%;z-index:9999;pointer-events:none;overflow:hidden;contain:layout paint}.weather-drop,.weather-flake{position:absolute;top:-12vh;left:var(--x);will-change:transform;pointer-events:none}.weather-drop{width:2px;height:17px;border-radius:100% 100% 60% 60%;background:#A2D2FF;box-shadow:0 0 6px #A2D2FF;opacity:.76;animation:weather-rain var(--duration) linear infinite;animation-delay:var(--delay)}.weather-flake{color:#FFFDD0;font-size:var(--size);text-shadow:0 0 5px #fff,0 0 10px #fffdd0;opacity:.9;animation:weather-snow var(--duration) linear infinite;animation-delay:var(--delay)}.weather-glow{position:absolute;right:-10vw;top:-18vh;width:min(58vw,660px);height:min(58vw,660px);border-radius:50%;background:radial-gradient(circle,#fffdd0aa 0%,#ffd9ad66 34%,#ffb6c122 61%,transparent 72%);filter:blur(10px);transform-origin:75% 25%;animation:weather-sun 5s ease-in-out infinite alternate}
@keyframes weather-rain{from{transform:translate3d(0,-4vh,0)}to{transform:translate3d(-30px,116vh,0)}}@keyframes weather-snow{0%{transform:translate3d(0,-4vh,0) rotate(0deg)}50%{transform:translate3d(var(--sway),54vh,0) rotate(90deg)}100%{transform:translate3d(0,116vh,0) rotate(180deg)}}@keyframes weather-sun{from{opacity:.5;transform:scale(.94)}to{opacity:.84;transform:scale(1.08)}}@media(prefers-reduced-motion:reduce){.weather-drop,.weather-flake,.weather-glow{animation:none}.weather-drop,.weather-flake{display:none}}
.landed-dart{position:absolute;z-index:9;width:40px;height:40px;transform:translate(-50%,-50%);pointer-events:none;will-change:left,top}
.landed-dart[hidden]{display:none}
.landed-dart svg{display:block;width:40px;height:40px}
.dart-pin{position:absolute;left:50%;top:50%;width:0;height:0;transform:translate3d(0,0,0);transform-style:preserve-3d;will-change:transform;pointer-events:none}
.impact-shell{position:absolute;left:50%;top:50%;width:0;height:0;transform:translate3d(0,0,0);transform-style:preserve-3d;will-change:transform}
.impact-shell.shake{animation:hit-shake .15s linear both}
.dart{position:absolute;left:50%;top:50%;width:0;height:0;transform-origin:0 0 0;transform-style:preserve-3d;transform:translate3d(0,0,0);will-change:transform;backface-visibility:hidden}
.impact-shell .dart{left:0;top:0}
.shaft{position:absolute;left:-8px;top:-137.5px;width:16px;height:275px;border:2px solid #a4375d;border-radius:8px;background:linear-gradient(90deg,#9f2c55,#ff82a4 45%,#bd3f68);transform:translateZ(142.5px) rotateX(-90deg)}
.shaft-side{width:13px;border-color:#bf5172;background:#e35c87;transform:translateZ(142.5px) rotateX(-90deg) rotateY(90deg)}
.nose{position:absolute;left:-7.5px;top:-7.5px;width:15px;height:15px;border:2px solid #775a62;border-radius:50%;background:#f4d7ae;transform:translateZ(0)}
.tip-anchor{position:absolute;left:0;top:0;width:0;height:0;transform:translateZ(0)}
.tail{position:absolute;left:-70px;top:-76px;width:140px;height:152px;transform:translateZ(285px);backface-visibility:hidden}
.particles{position:absolute;inset:0;z-index:9;pointer-events:none;visibility:hidden;overflow:hidden}
.particles.active{visibility:visible}
.particle{position:absolute;left:var(--hit-x, 50%);top:var(--hit-y, 50%);font-size:22px;line-height:1;color:var(--tone);text-shadow:0 0 10px var(--tone);opacity:0;transform:translate3d(-50%,-50%,0);will-change:transform,opacity}
.particle.coconut{font-size:27px;text-shadow:0 0 5px #FFFDD0,0 0 10px #8B5A2B}
.particles.active .particle{animation:particle-burst 1.5s cubic-bezier(.16,.8,.2,1) both}
@keyframes hit-shake{
  0%{transform:translate3d(1.8px,-1px,0) rotate(.9deg)}
  20%{transform:translate3d(-1.3px,.8px,0) rotate(-.7deg)}
  40%{transform:translate3d(.9px,-.5px,0) rotate(.45deg)}
  60%{transform:translate3d(-.5px,.3px,0) rotate(-.25deg)}
  80%{transform:translate3d(.2px,-.1px,0) rotate(.1deg)}
  100%{transform:translate3d(0,0,0) rotate(0deg)}
}
@keyframes particle-burst{
  0%{opacity:1;transform:translate3d(-50%,-50%,0) scale(1.15) rotate(0deg)}
  30%{opacity:1;transform:translate3d(calc(-50% + var(--burst-x)),calc(-50% + var(--burst-y)),0) scale(1) rotate(var(--burst-rotation))}
  60%{opacity:.65;transform:translate3d(calc(-50% + var(--sway-x)),calc(-50% + var(--sway-y)),0) scale(.6) rotate(var(--mid-rotation))}
  100%{opacity:0;transform:translate3d(calc(-50% + var(--final-x)),calc(-50% + var(--final-y)),0) scale(.15) rotate(var(--rotation))}
}
@media(max-width:600px){.topbar{top:12px;left:12px;max-width:calc(100% - 24px);padding:9px 13px 9px 10px}.brand{font-size:clamp(16px,4.3vw,21px)}.tagline{font-size:11px}.throw-button{min-width:220px;min-height:68px;font-size:21px}.result-card{right:10px;bottom:calc(120px + env(safe-area-inset-bottom));width:calc(100% - 20px);max-height:48vh}.status{top:78px}}
@media(max-width:600px){.preference-bar{bottom:calc(120px + env(safe-area-inset-bottom));gap:5px}.preference-button{padding:7px 8px;font-size:11px}.result-card{bottom:calc(168px + env(safe-area-inset-bottom));max-height:44vh}}
</style>
</head>
<body>
<div id="map" aria-label="申根区与英国地图"></div>
<div id="country-overlay" class="country-overlay" aria-hidden="true" hidden></div>
<div id="fps-stage" class="fps-stage" aria-hidden="true"><div id="dart-pin" class="dart-pin" hidden><div class="impact-shell"><div class="dart"><div class="shaft"></div><div class="shaft shaft-side"></div><div class="nose"></div><span class="tip-anchor"></span><img class="tail" alt="" draggable="false" width="140" height="152"
      src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 92 100'%3E%3Cpath d='M42 84 L9 20 Q0 7 8 4 Q28 0 46 45 Z' fill='%23ffb6cb' stroke='%23b43b69' stroke-width='3'/%3E%3Cpath d='M50 84 L83 20 Q92 7 84 4 Q64 0 46 45 Z' fill='%23ff8eae' stroke='%23b43b69' stroke-width='3'/%3E%3Cpath d='M46 37 C29 14 20 39 46 58 C72 39 63 14 46 37 Z' fill='%23fff4f7' stroke='%23d65d83' stroke-width='2'/%3E%3C/svg%3E"></div></div></div><div id="particles" class="particles" aria-hidden="true"></div></div>
<header class="topbar"><div class="logo" aria-hidden="true">🥥</div><div><div class="brand">椰椰和小鱼的旅行飞镖</div><div class="tagline">把下一站交给一点点运气</div></div></header>
<button id="passport-button" class="passport-button" type="button">📖 我的旅行护照</button>
<div id="passport-modal" class="passport-modal" role="dialog" aria-modal="true" aria-labelledby="passport-title" hidden><div class="passport-panel"><div class="passport-heading"><h2 id="passport-title">我的旅行护照</h2><button id="passport-close" class="passport-close" type="button" aria-label="关闭护照">×</button></div><p id="passport-summary" class="passport-summary"></p><div id="stamp-grid" class="stamp-grid"></div><button id="passport-clear" class="passport-clear" type="button">清空护照</button></div></div>
<div id="preference-bar" class="preference-bar" role="group" aria-label="旅行偏好"><button class="preference-button" type="button" data-preference="history" aria-pressed="false">🏛️ 人文历史</button><button class="preference-button" type="button" data-preference="nature" aria-pressed="false">🌲 自然秘境</button><button class="preference-button" type="button" data-preference="all" aria-pressed="true">🎲 我全都要</button></div>

 function clearWeather(){
  if(weatherController){weatherController.abort();weatherController=null}
  weatherLayer.replaceChildren();
  if(weatherBadge){weatherBadge.hidden=true;weatherBadge.textContent=""}
 }
 function weatherKind(code){
  if((code>=51&&code<=67)||(code>=80&&code<=82)||(code>=95&&code<=99))return "rain";
  if((code>=71&&code<=77)||(code>=85&&code<=86))return "snow";
  if(code>=0&&code<=3)return "sun";
  return "cloud"
 }
 function renderWeather(code){
  weatherLayer.replaceChildren();
  const kind=weatherKind(code);
  if(kind==="sun"){
   const glow=document.createElement("div");glow.className="weather-glow";weatherLayer.appendChild(glow);return
  }
  if(kind!=="rain"&&kind!=="snow")return;
  const fragment=document.createDocumentFragment();
  const count=kind==="rain"?50:40;
  for(let i=0;i<count;i++){
   const particle=document.createElement("span");
   particle.className=kind==="rain"?"weather-drop":"weather-flake";
   if(kind==="snow")particle.textContent="❄";
   const duration=kind==="rain"?1.1+Math.random()*.8:6+Math.random()*5;
   particle.style.setProperty("--x",(Math.random()*100).toFixed(2)+"%");
   particle.style.setProperty("--duration",duration.toFixed(2)+"s");
   particle.style.setProperty("--delay",(-Math.random()*duration).toFixed(2)+"s");
   if(kind==="snow"){
    particle.style.setProperty("--size",(12+Math.random()*12).toFixed(0)+"px");
    particle.style.setProperty("--sway",(Math.random()*54-27).toFixed(0)+"px")
   }
   fragment.appendChild(particle)
  }
  weatherLayer.appendChild(fragment)
 }
 async function requestWeather(point,token){
  if(weatherController)weatherController.abort();
  const controller=new AbortController();weatherController=controller;
  const timeout=setTimeout(()=>controller.abort(),12000);
  try{
   const url=new URL("https://api.open-meteo.com/v1/forecast");
   url.search=new URLSearchParams({latitude:String(point.lat),longitude:String(point.lng),current_weather:"true"});
   const response=await fetch(url,{signal:controller.signal});
   if(!response.ok)throw new Error("天气查询 HTTP "+response.status);
   const data=await response.json();
   const code=Number(data.current_weather?.weathercode);
   const temperature=Number(data.current_weather?.temperature);
   if(!Number.isFinite(code)||!Number.isFinite(temperature))throw new Error("天气数据不完整");
   if(token!==round||controller!==weatherController)return;
   const kind=weatherKind(code);
   weatherBadge.textContent=(kind==="rain"?"🌧️":kind==="snow"?"❄️":kind==="sun"?"☀️":"☁️")+" "+Math.round(temperature)+"°C";
   weatherBadge.hidden=false;
   renderWeather(code)
  }catch(error){
   if(token===round&&controller===weatherController)console.log("实时天气查询失败",error)
  }finally{
   clearTimeout(timeout);
   if(controller===weatherController)weatherController=null
  }
 }
 function setStatus(message,error=false,duration=0){clearTimeout(statusTimer);status.textContent=message;status.className="status"+(error?" error":"");status.hidden=false;if(duration)statusTimer=setTimeout(()=>status.hidden=true,duration)}

 function getCountryCode(p){for(const key of ["ISO3166-1-Alpha-3","ISO3166-1-Alpha-2","ISO_A3","ISO_A2","iso_a3","iso_a2","ADM0_A3","SOV_A3","ISO3166-1-alpha-3","ISO3166-1"]){const value=p[key];if(!value)continue;const code=String(value).toUpperCase();if(ALLOWED_COUNTRIES.has(code))return code;if(ISO3[code])return ISO3[code]}return null}
 async function loadBorders(){
  const response=await fetch(BORDER_URL);
  if(!response.ok)throw Error(`边界数据 HTTP ${response.status}`);
  const data=await response.json();
  polygons=data.features.filter(f=>getCountryCode(f.properties||{})&&f.geometry).map(f=>turf.feature(f.geometry,{code:getCountryCode(f.properties||{})}));
  if(!polygons.some(poly=>poly.properties.code==="GB")){
   const ukResponse=await fetch("https://raw.githubusercontent.com/johan/world.geo.json/master/countries/GBR.geo.json");
   if(!ukResponse.ok)throw Error(`英国边界数据 HTTP ${ukResponse.status}`);
   const ukData=await ukResponse.json();
   const ukFeature=ukData.features?.find(feature=>feature.id==="GBR")||ukData.features?.[0]||ukData;
   if(!ukFeature.geometry)throw Error("英国边界数据缺少几何信息");
   polygons.push(turf.feature(ukFeature.geometry,{code:"GB"}))
  }
  if(!polygons.length)throw Error("没有加载到允许的欧洲国家边界");
  bordersReady=true;installCountryLayers();clearStatus()
 }
 function visitedExpression(){return ["in",["get","code"],["literal",Array.from(visitedCountries)]]}
 function updateCountryPaint(){
  if(!map.getLayer("schengen-visited-fill"))return;
  map.setPaintProperty("schengen-visited-fill","fill-color",["case",visitedExpression(),"#FFB6C1","#E0E0E0"]);
  map.setPaintProperty("schengen-visited-fill","fill-opacity",["case",visitedExpression(),0.4,0.35]);
  map.setPaintProperty("schengen-visited-line","line-opacity",["case",visitedExpression(),0.95,0])
 }
 function installCountryLayers(){
  if(!polygons.length||!map.isStyleLoaded()||map.getSource("schengen-country-data"))return;
  const beforeId=map.getStyle().layers.find(layer=>layer.type==="symbol")?.id;
  map.addSource("schengen-country-data",{type:"geojson",data:{type:"FeatureCollection",features:polygons}});
  map.addLayer({id:"schengen-visited-fill",type:"fill",source:"schengen-country-data",paint:{"fill-color":"#E0E0E0","fill-opacity":0.35}},beforeId);
  map.addLayer({id:"schengen-visited-line",type:"line",source:"schengen-country-data",paint:{"line-color":"#FF69B4","line-width":2,"line-opacity":0}},beforeId);
  updateCountryPaint()
 }

  if(!ALLOWED_COUNTRIES.has(code)||visitedCountries.has(code))return;

 function positionDart(){

  particleLayer.style.setProperty("--hit-y",pixel.y+"px")
 }
 function easeOutCubic(t){return 1-Math.pow(1-t,3)}
 function renderFlight(progress){
  const eased=1-(1-progress)*(1-progress);
  const p=.65*eased+.35*progress;
  const y=72*(1-p)-432*p*(1-p);
  const z=150-800*p;
  const scale=1.4-.52*p;
  const pitch=10-42*(1-p)*(1-p);
  const yaw=-8*(1-p)*(1-p);
  dart.style.transform="translate3d(0,"+y+"px,"+z+"px) rotateX("+pitch+"deg) rotateY("+yaw+"deg) scale("+scale+")"
 }
 function renderImpact(progress){
  const z=progress<.4?-650-20*easeOutCubic(progress/.4):-670+5*easeOutCubic((progress-.4)/.6);
  dart.style.transform="translate3d(0,0,"+z+"px) rotateX(10deg) rotateY(0deg) scale(.88)"
 }
 function triggerImpact(){
  const contactStamp=performance.now();
  impactShell.classList.add("shake");
  particleLayer.classList.add("active");
  const particleStamp=performance.now();
  console.log("Contact:",contactStamp.toFixed(2),"ms; particles:",particleStamp.toFixed(2),"ms; delta:",(particleStamp-contactStamp).toFixed(2),"ms")
 }
 function moveFlightAnchor(progress,point){
  const rect=map.getContainer().getBoundingClientRect();
  const pixel=map.project([point.lng,point.lat]);
  const approach=.65*(1-(1-progress)*(1-progress))+.35*progress;
  const startY=rect.height*.39;
  const visibleX=Math.max(0,Math.min(rect.width,pixel.x));
  const visibleY=Math.max(0,Math.min(rect.height,pixel.y));
  const x=(visibleX-rect.width/2)*approach;
  const y=startY*(1-approach)+(visibleY-rect.height/2)*approach;
  pin.style.transform="translate3d("+x+"px,"+y+"px,0)"
 }
 function flyDart(point){
  cancelAnimationFrame(flightFrame);
  dartPoint=point;
  flightActive=true;
  impactActive=false;
  pin.hidden=false;
  impactShell.classList.remove("shake");
  particleLayer.classList.remove("active");
  particleLayer.style.display="block";
  renderFlight(0);
  moveFlightAnchor(0,point);
  return new Promise(resolve=>{
   let start=null,impactStart=null;
   function tick(now){
    if(start===null)start=now;
    const elapsed=now-start;
    if(!impactActive){
     if(elapsed<flightDuration){
      const progress=elapsed/flightDuration;
      moveFlightAnchor(progress,point);
      renderFlight(progress)
     }else{
      moveFlightAnchor(1,point);
      renderFlight(1);
      flightActive=false;
      positionDart();
      triggerImpact();
      setTimeout(()=>recordPassportHit(point.countryCode),0);
      impactActive=true;
      impactStart=now
     }
    }else{
     const progress=Math.min((now-impactStart)/settleDuration,1);
     renderImpact(progress);
     if(progress>=1){
      flightFrame=0;
      pin.hidden=true;
      landedMarker.hidden=false;
      positionDart();
      resolve();
      return
     }
    }
    flightFrame=requestAnimationFrame(tick)
   }
   flightFrame=requestAnimationFrame(tick)
  })
 }
 async function requestNominatim(point,token,language){const elapsed=Date.now()-lastNominatim;if(elapsed<1100)await pause(1100-elapsed);if(token!==round)return null;lastNominatim=Date.now();nominatimController=new AbortController();const url=new URL("https://nominatim.openstreetmap.org/reverse");url.search=new URLSearchParams({format:"jsonv2",lat:String(point.lat),lon:String(point.lng),zoom:"10",addressdetails:"1",namedetails:"1",...(language?{"accept-language":language}:{})});console.log("Nominatim 请求",url.href);const response=await fetch(url,{headers:{Accept:"application/json"},signal:nominatimController.signal});if(!response.ok)throw Error(`地名查询 HTTP ${response.status}`);const data=await response.json();console.log("Nominatim 结果",url.href,data);return data}
 function placeName(place){const address=place?.address||{};return place?.name||address.city||address.town||address.village||address.municipality||address.county||address.state||address.region||place?.display_name?.split(",")[0]||""}
 function bilingualName(zh,original){const chinese=(zh||"").trim();const local=(original||"").trim();return chinese&&local&&chinese!==local?chinese+" ("+local+")":chinese||local||"未知地点"}
 function preferenceName(value){
  return value==="history"?"人文历史":value==="nature"?"自然秘境":"全都要"
 }
 function parseTravelReport(value){
  if(!value||typeof value!=="object"||Array.isArray(value))throw new Error("Invalid report");
  const required=(text)=>{
   if(typeof text!=="string"||!text.trim())throw new Error("Missing report field");
   return text.trim()
  };
  const tags=Array.isArray(value.tags)?value.tags.map(required):[required(value.tags)];
  if(!tags.length)throw new Error("Missing tags");
  const match=value.preferenceMatch;
  if(!match||!["高","中","低"].includes(match.level))throw new Error("Invalid preference match");
  if(!Array.isArray(value.alternativeSpots))throw new Error("Invalid alternative spots");
  const alternatives=value.alternativeSpots.map(spot=>({name:required(spot.name),distance:required(spot.distance),reason:required(spot.reason)}));
  const budget=value.budget||{};
  const seasonal=value.seasonalBonus||{};
  const score=Number(value.totalScore);
  if(!Number.isFinite(score)||score<1||score>10)throw new Error("Invalid score");
  return {
   destination:required(value.destination),
   destination_zh:typeof value.destination_zh==="string"?value.destination_zh.trim():"",
   destination_en:typeof value.destination_en==="string"?value.destination_en.trim():"",
   nearestAirport:typeof value.nearestAirport==="string"?value.nearestAirport.trim().toUpperCase():"",
   tags,
   preferenceMatch:{level:match.level,reason:required(match.reason)},
   alternativeSpots:alternatives,
   recommendedPlay:typeof value.recommendedPlay==="string"?value.recommendedPlay.trim():"",
   budget:{transport:required(budget.transport),hotel:required(budget.hotel),food:required(budget.food),totalRange:required(budget.totalRange)},
   seasonalBonus:{season:required(seasonal.season),bonus:required(seasonal.bonus),reason:required(seasonal.reason)},
   totalScore:score,summary:required(value.summary)
  }
 }
 function renderTripReport(report){
  const matchStars=report.preferenceMatch.level==="高"?"⭐⭐⭐⭐⭐":report.preferenceMatch.level==="中"?"⭐⭐⭐":"⭐";

  card.querySelector("#season-tip").textContent=report.seasonalBonus.season+" · "+report.seasonalBonus.bonus+" - "+report.seasonalBonus.reason;
  card.querySelector("#travel-score").textContent=report.totalScore.toFixed(1)+" / 10";

 }
 function renderFlightInfo(info,report,landing){
  const status=card.querySelector("#flight-status");
  const booking=card.querySelector("#flight-booking");
  booking.hidden=true;
  booking.removeAttribute("href");
  if(!/^[A-Z]{3}$/.test(report.nearestAirport)||!info?.available||info.origin!=="BHX"||info.destination!==report.nearestAirport||typeof info.price!=="string"){
   status.textContent="暂时无法获取航班价格";
   return
  }
  const place=report.destination_zh||landing.zhName||report.destination;
  const time=/^\d{1,2}:\d{2}$/.test(info.departureTime||"")?" 今天 "+info.departureTime+" 出发":" 今天出发";
  status.textContent="伯明翰 (BHX) → "+place+" ("+info.destination+")"+time+",价格 "+info.price+" 起";

   try{

 function currentMonthInUK(){
  return Number(new Intl.DateTimeFormat("en-GB",{month:"numeric",timeZone:"Europe/London"}).format(new Date()))
 }
 async function loadPostcard(landing,title,token,preferred=false){
  const pageTitle=(title||landing.originalName||landing.zhName||"").trim();
  if(!pageTitle)return;
  if(landing.photoTitles.has(pageTitle))return;
  landing.photoTitles.add(pageTitle);
  let imagePromise=postcardCache.get(pageTitle);
  if(!imagePromise){
   imagePromise=(async()=>{
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),10000);
    try{
     const url="https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(pageTitle.replaceAll(" ","_"));
     const response=await fetch(url,{headers:{Accept:"application/json"},signal:controller.signal});
     if(!response.ok)throw new Error("Wikipedia HTTP "+response.status);
     const summary=await response.json();
     const source=summary.thumbnail?.source||summary.originalimage?.source||"";
     return source.startsWith("https://")?source:""
    }catch(error){
     console.log("Wikipedia 图片查询失败",pageTitle,error);
     return ""
    }finally{clearTimeout(timeout)}
   })();
   postcardCache.set(pageTitle,imagePromise)
  }
  const imageUrl=await imagePromise;
  if(token!==round||landing!==currentLanding||!imageUrl)return;
  if(!preferred&&landing.preferredPhotoSelected)return;
  const image=card.querySelector("#postcard-image");
  if(!image)return;
  if(preferred)landing.preferredPhotoSelected=true;
  image.classList.remove("is-loaded");
  image.onload=()=>{if(token===round&&landing===currentLanding){image.classList.add("is-loaded");if(preferred)landing.preferredPhotoShown=true}};
  image.onerror=()=>console.log("Wikipedia 图片加载失败",imageUrl);
  image.alt=pageTitle+"的旅行风景";
  image.src=imageUrl
 }
 async function requestTripReport(landing,preference,token){
  if(analysisController)analysisController.abort();
  const requestId=++analysisRequestId;
  analysisController=new AbortController();
  const controller=analysisController;
  const timeout=setTimeout(()=>controller.abort(),65000);
  const hadReport=!tripReport.hidden;
  rethinkButton.disabled=true;
  aiAnalysis.hidden=false;
  aiAnalysis.textContent=hadReport?"AI 正在按新偏好重新分析...":"AI 正在为你分析周边好玩的地方...";
  try{
   const response=await fetch("/api/deepseek",{
    method:"POST",
    headers:{"Content-Type":"application/json","Accept":"application/json"},
    body:JSON.stringify({location:landing.originalName||landing.zhName||"未知地点",locationZh:landing.zhName,address:landing.address,countryCode:landing.countryCode,preference:preferenceName(preference),currentMonth:currentMonthInUK()}),
    signal:controller.signal
   });
   let data;
   try{data=await response.json()}catch(error){throw new Error("Invalid JSON response")}
   if(token!==round||requestId!==analysisRequestId)return;
   if(!response.ok)throw new Error(data.error||"HTTP "+response.status);
   const report=parseTravelReport(data.report);
   renderTripReport(report);
   renderFlightInfo(data.flightInfo,report,landing);
   destination.textContent=bilingualName(report.destination_zh||landing.zhName,landing.originalName||report.destination_en);
   if(!landing.aiPhotoChecked){

   }
  }catch(error){
   if(token!==round||requestId!==analysisRequestId)return;
   aiAnalysis.hidden=false;
   aiAnalysis.textContent="暂时无法分析，请重试";
   if(hadReport)tripReport.hidden=false;

   clearTimeout(timeout);
   if(token===round&&requestId===analysisRequestId)rethinkButton.disabled=false
  }
 }
